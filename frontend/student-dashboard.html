<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script><script src="script.js" defer></script></head>
<body><header><h1>Student Dashboard</h1><nav><a href="login.html" id="logoutLink">Log out</a></nav></header>
<main class="container"><p id="welcome"></p>
<section><h2>Semester Marks</h2><form id="marksForm"><label for="semester">Semester</label><select id="semester" required><option value="">Select semester</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select><label for="marks">Marks (%)</label><input type="number" id="marks" min="0" max="100" step="0.01" required><button class="btn-primary">Save Marks</button></form><p id="marksMessage" role="status"></p><canvas id="performanceChart"></canvas></section>
<section><h2>Upload Certificates</h2><form id="certificateForm"><label for="certificateFiles">PDF, JPG or PNG (up to 5 files; 5 MB each)</label><input id="certificateFiles" type="file" accept=".pdf,.jpg,.jpeg,.png" multiple required><button class="btn-primary">Upload</button></form><p id="certificateMessage" role="status"></p><ul id="certificateList"></ul></section>
<section><h2>Faculty Feedback</h2><ul id="commentsList"></ul></section></main></body></html>
